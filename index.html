<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spectrum">
<meta name="theme-color" content="#000000" id="themeColor">
<link rel="apple-touch-icon" id="touchIcon" href="data:,">
<title>Retro Spectrum</title>
<style>
:root{--bg:#000;--panel:#0A1510;--accent:#8CFFC0;--label:#3A5F4C;--segoff:#1B2E24;--line:rgba(140,255,192,.2);--glow:rgba(140,255,192,.55);--bri:1;
  --mono:"SF Mono",ui-monospace,Menlo,"Cascadia Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--mono);-webkit-text-size-adjust:100%}
#app{position:fixed;inset:0;filter:brightness(var(--bri))}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.layer{position:absolute;inset:0;transition:opacity .45s ease}
.hidden{opacity:0;pointer-events:none}

#overlay{display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--accent);text-align:center;
  padding:24px;cursor:pointer;touch-action:none}
.ov-title{font-size:clamp(24px,5.5vw,60px);font-weight:600;letter-spacing:.32em;padding-left:.32em;
  text-shadow:0 0 14px var(--glow),0 0 42px var(--glow);animation:pulse 2.6s ease-in-out infinite}
.ov-title.err{animation:none;color:var(--accent)}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.ov-sub{margin-top:18px;font-size:12px;letter-spacing:.42em;padding-left:.42em;color:var(--label);line-height:2}
.ov-lamps{display:flex;gap:5px;justify-content:center;align-items:flex-end;margin-bottom:38px}
.ov-lamps i{display:flex;flex-direction:column-reverse;gap:3px}
.ov-lamps b{display:block;width:7px;height:12px;border-radius:4px;background:var(--segoff)}
.ov-lamps b.on{background:var(--accent);box-shadow:0 0 9px var(--glow)}
.ov-btns{margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.ovb{font:600 13px var(--mono);letter-spacing:.3em;padding:15px 24px 15px calc(24px + .3em);border-radius:999px;cursor:pointer;
  color:var(--accent);background:transparent;border:1px solid var(--accent);box-shadow:0 0 14px var(--line),inset 0 0 10px var(--line)}

#settings{display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.62);
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.sheet{width:min(800px,100%);max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;
  background:var(--panel);color:var(--accent);border:1px solid var(--line);border-radius:18px;padding:16px 22px 22px;
  box-shadow:0 0 50px var(--line)}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px}
.sh-title{font-size:13px;letter-spacing:.42em;text-shadow:0 0 10px var(--glow)}
.x{font:600 18px var(--mono);color:var(--accent);background:transparent;border:1px solid var(--line);border-radius:999px;width:38px;height:38px;cursor:pointer}
.row{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row.full{grid-template-columns:1fr}
.lbl{font-size:11px;letter-spacing:.26em;color:var(--label)}
.lbl small{display:block;margin-top:4px;font-size:9px;letter-spacing:.18em;opacity:.85}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font:600 11px var(--mono);letter-spacing:.16em;color:var(--label);background:transparent;border:1px solid var(--line);
  border-radius:999px;padding:9px 13px;cursor:pointer}
.opt.on{color:var(--accent);border-color:var(--accent);box-shadow:0 0 12px var(--line),inset 0 0 8px var(--line);text-shadow:0 0 8px var(--glow)}
.opt:disabled{opacity:.28;cursor:default}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{padding:0;border:2px solid transparent;border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;display:block;width:100%}
.card canvas{display:block;width:100%;height:auto;aspect-ratio:16/10}
.card span{display:block;font:600 10px var(--mono);letter-spacing:.2em;padding:8px 10px}
.slider{display:flex;align-items:center;gap:14px}
.slider input{flex:1;accent-color:var(--accent);min-width:0}
.val{font-size:12px;min-width:86px;text-align:right;letter-spacing:.08em}
select{font:600 12px var(--mono);background:transparent;color:var(--accent);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
option{background:#111;color:#eee}
.note{font-size:10px;letter-spacing:.14em;color:var(--label);line-height:1.8;padding-top:14px;border-top:1px solid var(--line)}
.note b{color:var(--accent);font-weight:600}
@media (max-width:560px){.row{grid-template-columns:1fr;gap:8px}.themes{grid-template-columns:repeat(2,1fr)}}
</style>

<script>
'use strict';
/* ============================================================
   Constants, themes, helpers, settings
   ============================================================ */
const MONO = '"SF Mono", ui-monospace, Menlo, "Cascadia Mono", Consolas, monospace';
const F_LO = 30, F_HI = 16000, FFT = 4096;
const BAND_OPTS = [12, 16, 20, 24, 31];
const SEG_OPTS = [8, 12, 16, 24, 0];          // 0 = continuous
const HOLD_OPTS = [0, 500, 900, 1500, 3000];
const DECAY_DB = { slow: 7, medium: 14, fast: 28 };   // dB per second
const OVER_RED = '#FF3B30';
const DEMO = /[?&]demo\b/.test(location.search);
const IN_APP = /[?&]app\b/.test(location.search);       // inside the native iPad wrapper (it keeps the screen awake itself)

// Each theme is a token set + a layout variant. The renderer knows nothing about individual themes.
// `segments` is the segment count applied when the theme is picked (user can change it after).
const THEMES = [
  { id: 'vfd-green', name: 'VFD Green', layout: 'wide', colourMode: 'fixed',

  { id: 'jdm-night', name: 'JDM Night', layout: 'split', colourMode: 'level',

    segLow: '#3BE85C', segHigh: '#FF3B2F', peak: '#FFFFFF', accent: '#FF8C1A', label: '#8A5A22', panelBorder: '#3A2410',
    glow: '#FF8C1A', glowStrength: 10, segGap: 2, barGap: 4, radius: 1, header: 'SPECTRUM ANALYZER',
    freqs: [40, 100, 250, 1000, 4000, 16000], segments: 16 },
  { id: 'bubble-grid', name: 'Bubble Grid', layout: 'synth', colourMode: 'gradient',
    bg: '#05060F', panel: '#080A1A', segOff: '#141A33', segLow: '#1E7BFF', segHigh: '#58D8FF', peak: '#FF4FA3',
    accent: '#FF4FA3', label: '#4A6BA8',
    glow: '#58D8FF', glowStrength: 16, segGap: 3, barGap: 4, radius: 2,
    header: 'GRAPHIC EQUALIZER', headerColour: '#58D8FF', headerRight: 'SPECTRUM ANALYZER',

  { id: 'wireframe-lcd', name: 'Wireframe LCD', layout: 'instrument', colourMode: 'fixed',
    bg: '#EDEFF2', panel: '#E3E7ED', segOff: '#CDD4DE', segLow: '#1E3A6B', segHigh: '#1E3A6B', peak: '#0A1428',
    accent: '#4A6FA5', label: '#6B7A90', lineWork: '#A8B4C6',
    glow: '#000000', glowStrength: 0, segGap: 2, barGap: 3, radius: 0, inverted: true,
    header: 'FFT {SR}  VER 3.2', freqs: [50, 100, 200, 500, 1000, 2000, 5000, 10000], segments: 12 },
  { id: 'nixie-amber', name: 'Nixie Amber', layout: 'wide', colourMode: 'fixed',
    bg: '#0B0603', panel: '#120A04', segOff: '#2B1A08', segLow: '#FFAE42', segHigh: '#FFD892', peak: '#FFF6E0',
    accent: '#FFAE42', label: '#7A4A14', glow: '#FFAE42', glowStrength: 26, segGap: 2, barGap: 4, radius: 3,
    header: 'SPECTRUM ANALYZER', freqs: [40, 100, 1000, 4000, 16000], segments: 12 },
  { id: 'scope-green', name: 'Scope Green', layout: 'wide', colourMode: 'fixed',
    bg: '#000000', panel: '#020A04', segOff: '#06230D', segLow: '#33FF66', segHigh: '#33FF66', peak: '#CCFFDD',
    accent: '#33FF66', label: '#1A7A33', glow: '#33FF66', glowStrength: 20, segGap: 1, barGap: 2, radius: 0,
    scanlines: true, scanlineOpacity: 0.05, persistence: 0.25, header: 'SPECTRUM ANALYZER',
    freqs: [40, 100, 250, 1000, 4000, 16000], segments: 0 },
  { id: 'gaming-rgb', name: 'Gaming RGB', layout: 'wide', colourMode: 'band',
    bg: '#000000', panel: '#000000', segOff: '#0D0D12', segLow: '#FF2D95', segHigh: '#FF2D95', peak: '#FFFFFF',
    accent: '#B26BFF', label: '#444450', glow: '#B26BFF', glowStrength: 22, segGap: 2, barGap: 3, radius: 2,
    header: 'SPECTRUM ANALYZER', freqs: [40, 100, 1000, 4000, 16000], segments: 16 },
  { id: 'night-rider', name: 'Night Rider', layout: 'kitt', colourMode: 'fixed', mirror: true,
    bg: '#000000', panel: '#080101', segOff: '#2A0605', segLow: '#FF1E0E', segHigh: '#FF6A45', peak: '#FFD0C0',
    accent: '#FF2A12', label: '#7A1E14', glow: '#FF1E0E', glowStrength: 24, segGap: 3, barGap: 6, radius: 1,
    header: 'VOICE ANALYSER', freqs: [40, 100, 250, 1000, 4000, 16000], segments: 12 },
  { id: 'red-led', name: 'Red LED', layout: 'wide', colourMode: 'fixed',
    bg: '#000000', panel: '#0D0303', segOff: '#2A0807', segLow: '#FF2A1A', segHigh: '#FF7055', peak: '#FFD6CC',
    accent: '#FF3B2A', label: '#7A2018', glow: '#FF2A1A', glowStrength: 22, segGap: 3, barGap: 4, radius: 1,
    header: 'SPECTRUM ANALYZER', freqs: [40, 100, 1000, 4000, 16000], segments: 16 },
  // Physical faceplates: the display sits behind glass in a real component's front panel
  { id: 'silver-receiver', name: 'Silver Receiver', layout: 'fascia', material: 'aluminium', face: '#BDBDBA', colourMode: 'fixed',
    bg: '#9C9C9A', panel: '#03141A', segOff: '#0C2A33', segLow: '#5FE3FF', segHigh: '#B5F3FF', peak: '#EFFFFF',
    accent: '#7FE6FF', label: '#2E7A92', glow: '#5FE3FF', glowStrength: 18, segGap: 3, barGap: 4, radius: 2,
    header: 'SPECTRUM', brand: 'STEREO SPECTRUM ANALYZER', model: 'SA-2400', freqs: [40, 100, 250, 1000, 4000, 16000], segments: 16 },
  { id: 'black-ash', name: 'Black Ash', layout: 'fascia', material: 'blackash', face: '#1C1C1C', print: '#B5B5B5', colourMode: 'fixed',
    bg: '#111111', panel: '#080503', segOff: '#2A1A08', segLow: '#FF9A2E', segHigh: '#FFD38F', peak: '#FFF1D6',
    accent: '#FFA640', label: '#8A5A22', glow: '#FF9A2E', glowStrength: 16, segGap: 2, barGap: 4, radius: 1,
    header: 'LEVEL', brand: 'GRAPHIC SPECTRUM DISPLAY', model: 'GS-850', freqs: [40, 100, 250, 1000, 4000, 16000], segments: 16 },
  { id: 'walnut-receiver', name: 'Walnut Receiver', layout: 'fascia', material: 'walnut', face: '#CFC2A3', colourMode: 'fixed',
    bg: '#3A2112', panel: '#120B05', segOff: '#2C1D0C', segLow: '#FFBE5C', segHigh: '#FFE2AE', peak: '#FFF6E6',
    accent: '#FFC46B', label: '#8A6A3A', glow: '#FFB347', glowStrength: 20, segGap: 3, barGap: 5, radius: 3,
    header: 'SPECTRUM', brand: 'STEREO SPECTRUM ANALYZER', model: 'SR-7700', freqs: [40, 100, 250, 1000, 4000, 16000], segments: 12 }
];

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const _rgb = new Map();
function rgb(hex) {
  let c = _rgb.get(hex);
  if (c) return c;
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const n = parseInt(h, 16);
  c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  if (_rgb.size > 3000) _rgb.clear();
  _rgb.set(hex, c);
  return c;
}
function rgba(hex, a) { const [r, g, b] = rgb(hex); return `rgba(${r},${g},${b},${a})`; }
function mix(h1, h2, t) {
  const a = rgb(h1), b = rgb(h2);
  return '#' + [0, 1, 2].map(i => Math.round(a[i] + (b[i] - a[i]) * t).toString(16).padStart(2, '0')).join('');
}
function hslHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return '#' + [f(0), f(8), f(4)].map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join('');
}

/* ---------- Settings (localStorage, every access guarded) ---------- */
const STORE_KEY = 'retroSpectrum.v1';
const DEFAULTS = {
  source: 'line', theme: 'vfd-green', bands: 24, segments: 16, channels: 'mono', peakHold: 900, decay: 'medium',
  labels: true, clockPanel: true, scanlines: true, glow: 'off', fullscreen: true, barsOnly: false, brightness: 100,
  devices: { line: '', mic: '' },
  perSource: { line: { floor: -72, ceil: -6, tilt: true, auto: true }, mic: { floor: -95, ceil: -35, tilt: true, auto: true } },
  // What auto-sensitivity has learned about each input (dBFS): waveform noise RMS, how high that
  // noise reads in the bands, and the loud-music reference the ceiling follows.
  learn: { line: { noise: -85, noiseBand: -95, ref: -12 }, mic: { noise: -65, noiseBand: -80, ref: -40 } }
};
function loadSettings() {
  const s = JSON.parse(JSON.stringify(DEFAULTS));
  try {
    const raw = localStorage.getItem(STORE_KEY);
    const o = raw ? JSON.parse(raw) : null;
    if (o && typeof o === 'object') {
      for (const k of Object.keys(DEFAULTS)) {
        if (o[k] === undefined) continue;
        if (k === 'devices') Object.assign(s.devices, o.devices);
        else if (k === 'perSource' || k === 'learn') { for (const sk of ['line', 'mic']) if (o[k][sk]) Object.assign(s[k][sk], o[k][sk]); }
        else s[k] = o[k];
      }
    }
  } catch (e) { /* storage unavailable: defaults */ }
  if (!THEMES.some(t => t.id === s.theme)) s.theme = DEFAULTS.theme;
  if (!BAND_OPTS.includes(s.bands)) s.bands = DEFAULTS.bands;
  s.segments = s.segments ? 16 : 0;                       // blocks (square, auto count) or smooth
  if (!['off', 'subtle', 'full'].includes(s.glow)) s.glow = 'off';
  if (!HOLD_OPTS.includes(s.peakHold)) s.peakHold = DEFAULTS.peakHold;
  if (!DECAY_DB[s.decay]) s.decay = DEFAULTS.decay;
  if (s.source !== 'line' && s.source !== 'mic') s.source = 'line';
  if (s.channels !== 'mono' && s.channels !== 'stereo') s.channels = 'mono';
  s.brightness = clamp(+s.brightness || 100, 20, 100);
  return s;
}
const S = loadSettings();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { } }
const theme = () => THEMES.find(t => t.id === S.theme) || THEMES[0];
const srcName = s => (s || S.source) === 'line' ? 'LINE IN' : 'MICROPHONE';

/* ============================================================
   Audio capture
   ============================================================ */
// iOS voice processing must be off for both sources (AGC pumps, NS gates sustained tones).
const PROC = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
const INTERNAL_RE = /built-?in|internal|ipad|iphone|macbook|imac|integrated|realtek|webcam|facetime|camera|array/i;
const A = { ctx: null, stream: null, track: null, nodes: [], demo: null, aL: null, aR: null, aM: null,
  stereo: false, live: false, deviceId: '', deviceLabel: '', devices: [] };
const App = { running: false, busy: false, overlay: 'start' };
const UI = { open: false };

class InputError extends Error { constructor(code) { super(code); this.code = code; } }
const isDenied = e => e && /NotAllowed|Security|PermissionDenied/.test(e.name || '');
const isExternal = d => d.deviceId !== 'default' && d.deviceId !== 'communications' && !!d.label && !INTERNAL_RE.test(d.label);

async function listInputs() {
  try { return (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput'); }
  catch (e) { return []; }
}

// Must be called synchronously inside a user gesture the first time (iOS).
function ensureCtx() {
  if (!A.ctx) {
    const C = window.AudioContext || window.webkitAudioContext;
    A.ctx = new C();
    A.ctx.onstatechange = () => {
      if (A.ctx.state !== 'running' && App.running) { App.running = false; showStart(); }
    };
  }
  if (A.ctx.state !== 'running') A.ctx.resume().catch(() => { });
  return A.ctx;
}

function teardown() {
  for (const n of A.nodes) { try { n.disconnect(); } catch (e) { } }
  A.nodes = [];
  if (A.demo) { for (const o of A.demo) { try { o.stop(); } catch (e) { } } A.demo = null; }
  if (A.stream) for (const t of A.stream.getTracks()) { t.onended = null; t.stop(); }
  A.stream = A.track = null;
  A.aL = A.aR = A.aM = null;
  A.live = false;
}

function makeAnalyser() {
  const a = A.ctx.createAnalyser();
  a.fftSize = FFT;
  a.smoothingTimeConstant = 0.6;   // low: attack stays snappy, decay is done in the draw loop
  a.minDecibels = -140; a.maxDecibels = 0;
  return a;
}

// node -> [mic: 80 Hz high-pass] -> splitter -> L/R analysers, plus a mono (down-mixed) analyser.
// Deliberately NOT connected to ctx.destination: the iPad must never play the signal back.
function wireGraph(node, source, stereo) {
  let n = node;
  if (source === 'mic') {
    const hp = A.ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 80; hp.Q.value = 0.707;
    n.connect(hp); n = hp; A.nodes.push(hp);
  }
  const sp = A.ctx.createChannelSplitter(2);
  n.connect(sp);
  A.aL = makeAnalyser(); A.aR = makeAnalyser(); A.aM = makeAnalyser();
  sp.connect(A.aL, 0); sp.connect(A.aR, 1); n.connect(A.aM);
  A.nodes.push(node, sp, A.aL, A.aR, A.aM);
  A.stereo = stereo;
  A.live = true;
  setupBands();
}

async function openSource(source) {
  teardown();
  if (DEMO) { buildDemo(source); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new InputError('INSECURE');
  let devs = await listInputs();
  if (!devs.some(d => d.label)) {
    // Labels are hidden until permission is granted: ask once, then look again.
    try { const s = await navigator.mediaDevices.getUserMedia({ audio: { ...PROC }, video: false }); s.getTracks().forEach(t => t.stop()); }
    catch (e) { throw new InputError(isDenied(e) ? 'DENIED' : source === 'line' ? 'NO_LINE' : 'NO_MIC'); }
    devs = await listInputs();
  }
  A.devices = devs;
  const want = S.devices[source];
  let dev = want ? devs.find(d => d.deviceId === want) : null;
  if (source === 'line') {
    dev = dev || devs.find(isExternal);
    if (!dev) throw new InputError('NO_LINE');      // never fall back to the mic silently
  } else {
    dev = dev || devs.find(d => !isExternal(d) && d.deviceId !== 'communications') || devs[0];
  }
  const cons = { ...PROC, channelCount: { ideal: source === 'line' ? 2 : 1 }, sampleRate: { ideal: 48000 } };
  if (dev) cons.deviceId = { exact: dev.deviceId };
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: cons, video: false }); }
  catch (e) { throw new InputError(isDenied(e) ? 'DENIED' : source === 'line' ? 'NO_LINE' : 'NO_MIC'); }
  A.stream = stream;
  A.track = stream.getAudioTracks()[0];

  g.addColorStop(0, 'rgba(0,0,0,0.6)'); g.addColorStop(0.5, 'rgba(0,0,0,0.25)'); g.addColorStop(1, `rgba(255,255,255,${hl})`);
  x.fillStyle = g; x.fill();
  x.beginPath(); rr(x, r.x, r.y, r.w, r.h, rad); x.fillStyle = t.panel; x.fill();
  x.clip();
  const s = x.createLinearGradient(0, r.y, 0, r.y + b * 5);    // inner shadow under the top lip
  s.addColorStop(0, 'rgba(0,0,0,0.75)'); s.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = s; x.fillRect(r.x, r.y, r.w, b * 5);
  x.restore();
}
function paintScrew(x, cx, cy, r) {
  const g = x.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
  g.addColorStop(0, '#F2F2F2'); g.addColorStop(0.6, '#9C9C9C'); g.addColorStop(1, '#4A4A4A');
  x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fillStyle = g; x.fill();
  x.strokeStyle = 'rgba(0,0,0,0.5)'; x.lineWidth = 1; x.stroke();
  x.save(); x.translate(cx, cy); x.rotate(0.6);
  x.fillStyle = 'rgba(0,0,0,0.65)'; x.fillRect(-r * 0.75, -r * 0.12, r * 1.5, r * 0.24);
  x.restore();
}
// Engraved into metal (dark letters with a light lower edge), or printed for black finishes
function engrave(x, str, X, Y, size, t, o = {}) {
  if (t.print) return text(x, str, X, Y, size, t.print, o);
  text(x, str, X, Y + Math.max(0.7, size * 0.07), size, 'rgba(255,255,255,0.55)', o);
  return text(x, str, X, Y, size, 'rgba(20,18,15,0.78)', o);
}

/* ============================================================
   Modules — composable blocks; layouts place them
   ============================================================ */
const MOD = {
  panel(R, r, f, it) {
    const t = f.theme, ctx = R.ctx, rad = it.rad ?? 0;
    ctx.save();
    ctx.beginPath(); rr(ctx, r.x, r.y, r.w, r.h, rad);
    ctx.fillStyle = it.fill || t.panel; ctx.fill();
    if (t.scanlines && !it.noScan) { ctx.clip(); ctx.fillStyle = R.scanPattern(t.accent, t.scanlineOpacity || 0.04); ctx.fillRect(r.x, r.y, r.w, r.h); }
    ctx.restore();
    ctx.save();
    ctx.beginPath(); rr(ctx, r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1, rad);
    ctx.strokeStyle = it.border || rgba(t.accent, t.inverted ? 0.35 : 0.1); ctx.lineWidth = it.bw || 1; ctx.stroke();
    ctx.restore();
  },

  statusRow(R, r, f) {
    const t = f.theme, ctx = R.ctx, cy = r.y + r.h / 2, mr = r.h * 0.34;
    drawMenu(R, ctx, r.x + mr, cy, mr, t);
    if (!f.opts.clockPanel) return;
    const glow = t.glowStrength ? r.h * 0.22 : 0, ch = r.h * 0.6;
    let x = r.x + mr * 2 + r.h * 0.45;
    x += seg7(ctx, f.clock.hm, x, cy - ch / 2, ch, t.accent, { glow, ghost: 0.07 }) + r.h * 0.4;
    const rule = xx => { ctx.fillStyle = rgba(t.accent, 0.35); ctx.fillRect(xx, cy - r.h * 0.3, 1, r.h * 0.6); };
    rule(x); x += r.h * 0.4;
    const s1 = r.h * 0.2;
    const w1 = text(ctx, f.clock.mdSlash, x, cy - r.h * 0.15, s1, t.accent, { glow: glow * 0.6, sp: 0.12 });
    text(ctx, f.clock.dow, x, cy + r.h * 0.16, s1, t.accent, { glow: glow * 0.6, sp: 0.3 });
    x += w1 + r.h * 0.4;
    if (f.battery != null) { rule(x); x += r.h * 0.4; text(ctx, f.battery + '%', x, cy, r.h * 0.24, t.accent, { glow: glow * 0.6, sp: 0.1 }); }
  },

  header(R, r, f, it) {
    const t = f.theme, ctx = R.ctx, cy = r.y + r.h / 2;
    let x = r.x;
    if (it.menu) { const mr = r.h * 0.46; drawMenu(R, ctx, x + mr, cy, mr, t); x += mr * 2 + r.h * 0.5; }
    const size = Math.max(f.minFont, r.h * 0.4), glow = t.glowStrength ? size * 0.8 : 0;
    const label = (t.header || '').replace('{SR}', (f.sr / 1000) + 'kHz');
    let xr = r.x + r.w;
    if (it.glyphs) xr = drawGlyphs(R, ctx, xr, cy, size, f, t) - size * 1.2;
    const fx = drawFlags(R, ctx, xr, cy, size * 0.9, f, t);
    // Title only if it fits beside the flags (narrow phones drop it rather than overlap)
    let lw = textW(ctx, label, size, 0.22);
    if (x + lw + size * 1.5 <= fx) text(ctx, label, x, cy, size, t.headerColour || t.accent, { sp: 0.22, glow, alpha: 0.92 });
    else lw = 0;
    if (t.headerRight) {
      const hw = textW(ctx, t.headerRight, size, 0.22);
      if (fx - size * 1.5 - hw > x + lw + size * 2)
        text(ctx, t.headerRight, fx - size * 1.5, cy, size, t.headerRightColour || t.label, { sp: 0.22, align: 'right' });
    }
    if (it.rule) { ctx.fillStyle = rgba(t.label, 0.45); ctx.fillRect(r.x, r.y + r.h + 0.5, r.w, 1); }
  },

  analyser(R, r, f) { R.drawAnalyser(r, f); },

  freqLabels(R, r, f, it) {
    const t = f.theme, ctx = R.ctx, F = it.field, size = Math.max(f.minFont, r.h * 0.5), lr = Math.log(F_HI / F_LO);
    let lastR = -1e9;
    for (const hz of t.freqs) {
      const s = hz >= 1000 ? (hz / 1000) + 'k' : String(hz), w = textW(ctx, s, size, 0.1);
      const cx = clamp(F.x + F.w * Math.log(hz / F_LO) / lr, F.x + w / 2, F.x + F.w - w / 2);
      if (cx - w / 2 < lastR + size * 0.6) continue;
      text(ctx, s, cx, r.y + r.h / 2, size, t.label, { align: 'center', sp: 0.1 });
      lastR = cx + w / 2;
    }
  },

  footer(R, r, f) {
    const t = f.theme, ctx = R.ctx, size = Math.max(f.minFont, r.h * 0.42), cy = r.y + r.h / 2, cx = r.x + r.w / 2;
    const w = text(ctx, t.footer || '', cx, cy, size, t.label, { align: 'center', sp: 0.45 }), g = size * 1.5;
    ctx.fillStyle = rgba(t.label, 0.45);
    ctx.fillRect(r.x, cy, Math.max(0, cx - w / 2 - g - r.x), 1);
    ctx.fillRect(cx + w / 2 + g, cy, Math.max(0, r.x + r.w - (cx + w / 2 + g)), 1);
  },

  // Clock / date / battery — stands in for the reference app's NOW PLAYING panel
  infoPanel(R, r, f, it) {
    const t = f.theme, ctx = R.ctx, pad = it.pad || 0, gl = t.glowStrength ? 0.22 : 0, cap = it.caption || 'LOCAL TIME';
    const b = { x: r.x + pad, y: r.y + pad, w: r.w - pad * 2, h: r.h - pad * 2 };
    const dateLine = f.clock.md + '  ' + f.clock.dow + (f.battery != null ? '   ' + f.battery + '%' : '');
    if (it.box) {
      ctx.save(); ctx.beginPath(); rr(ctx, r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1, it.rad || 0);
      if (it.fill) { ctx.fillStyle = it.fill; ctx.fill(); }
      ctx.strokeStyle = it.box; ctx.lineWidth = it.bw || 1;
      if (it.boxGlow) { ctx.shadowColor = it.box; ctx.shadowBlur = it.boxGlow; }
      ctx.stroke(); ctx.restore();
    }
    const v = it.v;
    if (v === 'h') {                       // [tile] caption/date ........ CLOCK
      let x = b.x;
      const ch = Math.min(b.h * 0.8, (b.x + b.w - x) * 0.6 / 2.9);
      seg7(ctx, f.clock.hm, b.x + b.w, b.y + (b.h - ch) / 2, ch, t.accent, { align: 'right', glow: gl * ch, ghost: 0.07 });
      const fs = Math.max(f.minFont, Math.min(b.h * 0.15, 15));
      text(ctx, cap, x, b.y + b.h * 0.36, fs, t.accent, { sp: 0.32, alpha: 0.9 });
      text(ctx, dateLine, x, b.y + b.h * 0.64, fs, t.label, { sp: 0.22 });
      return;
    }
    if (v === 'stack') {                   // caption / CLOCK / date, left-aligned
      const fs = Math.max(f.minFont, b.h * 0.11), ch = Math.min(b.h * 0.5, b.w / 2.95);
      const total = fs * 2 + ch + fs * 2.2, y0 = b.y + Math.max(0, (b.h - total) / 2);
      text(ctx, cap, b.x, y0 + fs * 0.6, fs, t.label, { sp: 0.32 });
      seg7(ctx, f.clock.hm, b.x, y0 + fs * 1.8, ch, t.accent, { glow: gl * ch, ghost: 0.07 });
      text(ctx, dateLine, b.x, y0 + fs * 1.8 + ch + fs * 1.5, fs, t.label, { sp: 0.22 });
      return;
    }
    // 'v': tall — tile, caption, very large clock, date
    const fs = Math.max(f.minFont, Math.min(b.w * 0.045, 16));
    const ch = Math.min(b.w / 2.95, b.h * 0.3);
    const total = fs * 1.6 + ch + fs * 2.6;
    let y = b.y + Math.max(0, (b.h - total) / 2);
    text(ctx, cap, b.x, y + fs * 0.5, fs, t.label, { sp: 0.38 }); y += fs * 1.6;
    seg7(ctx, f.clock.hm, b.x, y, ch, t.accent, { glow: gl * ch, ghost: 0.07 }); y += ch + fs * 2;
    text(ctx, dateLine, b.x, y, fs * 1.1, t.accent, { sp: 0.22, alpha: 0.85 });
  },

  scaleMarks(R, r, f, it) {
    const t = f.theme, ctx = R.ctx, F = it.field, size = Math.max(f.minFont, f.u * 1.3), x = r.x + r.w;
    const marks = [['+12', F.y + size * 0.6], ['0', F.y + F.h / 2], ['−12', F.y + F.h - size * 0.6]];
    for (const [s, y] of marks) {
      text(ctx, s, x - size * 0.9, y, size, t.label, { align: 'right', sp: 0.05 });
      ctx.fillStyle = rgba(t.label, 0.8); ctx.fillRect(x - size * 0.6, Math.round(y), size * 0.45, 1);
    }
  },

  caption(R, r, f) {
    const t = f.theme, ctx = R.ctx, cy = r.y + r.h / 2, s = r.h * 0.7;
    const w = text(ctx, 'FFT', r.x, cy, s, t.accent, { weight: 800, sp: 0.06, glow: t.glowStrength ? s * 0.35 : 0 });
    text(ctx, 'FAST FOURIER TRANSFORM', r.x + w + s * 0.6, cy, Math.max(f.minFont, s * 0.3), t.label, { sp: 0.42 });
  },

  // Static faceplate: material, screws, recessed display windows, engraved lettering (cached)
  fascia(R, r, f, it) { R.drawFascia(f, it); f.windows = it.windows; },

  // Glass over a display window: a faint diagonal reflection
  glass(R, r, f, it) {
    const ctx = R.ctx;
    for (const w of it.windows) {
      ctx.save(); ctx.beginPath(); rr(ctx, w.x, w.y, w.w, w.h, w.rad || 0); ctx.clip();
      const g = ctx.createLinearGradient(w.x, w.y, w.x + w.w * 0.5, w.y + w.h);
      g.addColorStop(0, 'rgba(255,255,255,0.07)'); g.addColorStop(0.4, 'rgba(255,255,255,0.015)'); g.addColorStop(0.41, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.restore();
    }
  },

  clockWin(R, r, f) {
    const t = f.theme, ctx = R.ctx, ch = Math.min(r.h * 0.58, r.w / 3.6);
    const cw = seg7W(f.clock.hm, ch), fs = Math.max(f.minFont, ch * 0.2);
    const x0 = r.x + (r.w - cw - fs * 5) / 2;
    seg7(ctx, f.clock.hm, x0, r.y + (r.h - ch) / 2, ch, t.accent, { glow: t.glowStrength ? ch * 0.25 : 0, ghost: 0.08 });
    text(ctx, f.clock.dow, x0 + cw + fs * 1.2, r.y + r.h / 2 - fs * 0.8, fs, t.accent, { sp: 0.2, alpha: 0.8 });
    text(ctx, f.clock.md, x0 + cw + fs * 1.2, r.y + r.h / 2 + fs * 0.9, fs, t.label, { sp: 0.15 });
  },

  // Front-panel controls: a metal DISPLAY push-button (opens settings) and indicator LEDs
  controls(R, r, f) {
    const t = f.theme, ctx = R.ctx, cy = r.y + r.h * 0.42, rad = Math.min(r.h * 0.27, r.w * 0.06);
    const fs = Math.max(f.minFont, f.u * 1.05), bx = r.x + rad * 1.4;
    const g = ctx.createRadialGradient(bx - rad * 0.3, cy - rad * 0.35, rad * 0.1, bx, cy, rad);
    g.addColorStop(0, t.material === 'blackash' ? '#5A5A5A' : '#FAFAFA'); g.addColorStop(0.7, t.material === 'blackash' ? '#262626' : '#A8A8A8');
    g.addColorStop(1, t.material === 'blackash' ? '#0E0E0E' : '#6A6A6A');
    ctx.save();
    ctx.beginPath(); ctx.arc(bx, cy + rad * 0.08, rad * 1.12, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();
    ctx.beginPath(); ctx.arc(bx, cy, rad, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
    engrave(ctx, 'DISPLAY', bx, cy + rad + fs * 1.4, fs, t, { align: 'center', sp: 0.25 });
    if (R.main) R.hits.menu = { x: bx - rad * 1.5, y: cy - rad * 1.5, w: rad * 3, h: rad * 3 };
    const leds = [['POWER', true, '#3BE85C'], ['SIGNAL', f.music, t.accent], ['CLIP', f.flags.over, OVER_RED]];
    let x = bx + rad * 2 + f.u * 4;
    const lr = Math.max(2.5, f.u * 0.65);
    for (const [label, on, col] of leds) {
      ctx.save();
      ctx.beginPath(); ctx.arc(x, cy, lr * 1.5, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fill();
      ctx.beginPath(); ctx.arc(x, cy, lr, 0, Math.PI * 2);
      if (on) { ctx.shadowColor = col; ctx.shadowBlur = lr * 4; ctx.fillStyle = col; }
      else ctx.fillStyle = mix(col, '#000000', 0.75);
      ctx.fill();
      ctx.restore();
      engrave(ctx, label, x, cy + rad + fs * 1.4, fs, t, { align: 'center', sp: 0.25 });
      x += Math.max(f.u * 8, textW(ctx, label, fs, 0.25) + f.u * 3);
    }
  },

  // Overall level as a row of lamps lighting outward from the centre (KITT-style bar, but a real meter)
  levelBar(R, r, f) {
    const t = f.theme, ctx = R.ctx, n = 16, half = n / 2, gap = r.w * 0.01, lw = (r.w - gap * (n - 1)) / n;
    const lit = Math.round(clamp(f.level, 0, 1) * half);
    ctx.save();
    for (let i = 0; i < n; i++) {
      const fromCentre = i < half ? half - 1 - i : i - half, on = fromCentre < lit;
      ctx.beginPath(); rr(ctx, r.x + i * (lw + gap), r.y, lw, r.h, r.h * 0.18);
      if (on) { ctx.shadowColor = t.glow; ctx.shadowBlur = r.h * 0.9; ctx.fillStyle = fromCentre >= half - 1 ? t.segHigh : t.segLow; }
      else { ctx.shadowBlur = 0; ctx.fillStyle = t.segOff; }
      ctx.fill();
    }
    ctx.restore();
  },

  // Console indicator lamps either side of a red seven-segment clock
  console(R, r, f) {
    const t = f.theme, ctx = R.ctx, fl = f.flags;
    const btns = [['AUTO LEVEL', f.autoOn], ['SIGNAL', f.music], ['LOUD', fl.loud], ['CLIP', fl.over]];
    const ch = r.h * 0.62, cw = f.opts.clockPanel ? seg7W(f.clock.hm, ch) + r.h * 1.2 : 0, gap = r.h * 0.25;
    const bw = (r.w - cw - gap * 3) / 4, bh = r.h * 0.78, by = r.y + (r.h - bh) / 2;
    const xs = [r.x, r.x + bw + gap, r.x + r.w - bw * 2 - gap, r.x + r.w - bw];
    btns.forEach(([label, on], i) => {
      const x = xs[i], lit = i === 3 ? '#FFB020' : t.segLow;
      ctx.save();
      ctx.beginPath(); rr(ctx, x, by, bw, bh, bh * 0.12);
      ctx.fillStyle = on ? lit : mix(t.panel, lit, 0.1);
      if (on) { ctx.shadowColor = lit; ctx.shadowBlur = bh * 0.5; }
      ctx.fill(); ctx.shadowBlur = 0;
      ctx.strokeStyle = rgba(lit, on ? 0.9 : 0.35); ctx.lineWidth = 1; ctx.stroke();
      ctx.restore();
      const size = Math.max(f.minFont, Math.min(bh * 0.24, bw / (label.length * 0.85)));
      text(ctx, label, x + bw / 2, by + bh / 2, size, on ? '#1A0200' : rgba(lit, 0.55), { align: 'center', sp: 0.12, weight: 700 });
    });
    if (cw) seg7(ctx, f.clock.hm, r.x + r.w / 2, r.y + (r.h - ch) / 2, ch, t.accent, { align: 'center', glow: ch * 0.25, ghost: 0.1 });
  }
};

/* ============================================================
   Layouts — each returns the modules it uses and where
   B = usable box (safe area + padding), u = 1% of the short side
   ============================================================ */
const LAYOUTS = {
  wide(B, u, t, o) {
    const port = B.h > B.w, items = [], sH = u * (port ? 8 : 9.5) * (o.small ? 1.4 : 1), gap = u * 1.4;
    items.push({ m: 'statusRow', r: { x: B.x, y: B.y, w: B.w, h: sH } });
    const P = { x: B.x, y: B.y + sH + gap, w: B.w, h: B.h - sH - gap };
    items.push({ m: 'panel', r: P, rad: u * 2.2 });
    const ip = u * 2.2, hh = u * 3.4, lh = o.labels ? u * 3.2 : 0;
    items.push({ m: 'header', r: { x: P.x + ip, y: P.y + ip * 0.7, w: P.w - ip * 2, h: hh } });
    const top = P.y + ip * 0.7 + hh + ip * 0.8;
    const field = { x: P.x + ip, y: top, w: P.w - ip * 2, h: P.y + P.h - ip * 0.7 - lh - (lh ? u * 0.8 : 0) - top };
    items.push({ m: 'analyser', r: field });
    if (lh) items.push({ m: 'freqLabels', r: { x: field.x, y: field.y + field.h + u * 0.8, w: field.w, h: lh }, field });
    return items;
  },

  // CD deck: header, a display window with the clock, the analyser, scale and a model-name footer
  deck(B, u, t, o) {
    const port = B.h > B.w, items = [], ip = u * 2.2, hh = u * 3.8, iw = B.w - ip * 2;
    items.push({ m: 'panel', r: B, rad: u * 1.8 });
    let y = B.y + ip * 0.7;
    items.push({ m: 'header', r: { x: B.x + ip, y, w: iw, h: hh }, menu: true });
    y += hh + ip * 0.7;
    if (o.clockPanel) {
      const rh = (port ? u * 11 : u * 12) * (o.small ? 1.4 : 1), dw = Math.min(iw, rh * 3.6);   // compact display window, centred
      items.push({ m: 'infoPanel', r: { x: B.x + (B.w - dw) / 2, y, w: dw, h: rh }, pad: u * 1.6, v: 'h', caption: 'TIME',
        box: rgba(t.accent, 0.3), fill: mix(t.panel, t.bg, 0.6), rad: u * 1 });
      y += rh + ip;
    }
    const fh = u * 3, lh = o.labels ? u * 3 : 0, bottom = B.y + B.h - ip * 0.6 - fh - u * 0.6;
    const field = { x: B.x + ip, y, w: iw, h: bottom - lh - (lh ? u * 0.6 : 0) - y };
    items.push({ m: 'analyser', r: field });
    if (lh) items.push({ m: 'freqLabels', r: { x: field.x, y: field.y + field.h + u * 0.6, w: field.w, h: lh }, field });
    items.push({ m: 'footer', r: { x: B.x + ip, y: bottom + u * 0.6, w: iw, h: fh } });
    return items;
  },

  // Car stereo: analyser with dB scale on the left, clock display on the right
  split(B, u, t, o) {
    const port = B.h > B.w, items = [], g = u * 1.4;
    let L = B, Rp = null;
    if (o.clockPanel && port) { const ih = B.h * (o.small ? 0.22 : 0.18); Rp = { x: B.x, y: B.y, w: B.w, h: ih }; L = { x: B.x, y: B.y + ih + g, w: B.w, h: B.h - ih - g }; }
    else if (o.clockPanel) { const lw = B.w * 0.65; L = { x: B.x, y: B.y, w: lw, h: B.h }; Rp = { x: B.x + lw + g, y: B.y, w: B.w - lw - g, h: B.h }; }
    items.push({ m: 'panel', r: L, rad: u * 1.2, border: t.panelBorder, bw: 1.5 });
    const ip = u * 2, hh = u * 3.6, ch = u * 4, lh = o.labels ? u * 3 : 0, sm = u * 5;
    let y = L.y + ip * 0.7;
    items.push({ m: 'header', r: { x: L.x + ip, y, w: L.w - ip * 2, h: hh }, menu: true });
    y += hh + ip * 0.8;
    const bottom = L.y + L.h - ip * 0.6 - ch;
    const field = { x: L.x + ip + sm, y, w: L.w - ip * 2 - sm, h: bottom - u * 0.8 - lh - (lh ? u * 0.6 : 0) - y };
    items.push({ m: 'scaleMarks', r: { x: L.x + ip, y: field.y, w: sm, h: field.h }, field });
    items.push({ m: 'analyser', r: field });
    if (lh) items.push({ m: 'freqLabels', r: { x: field.x, y: field.y + field.h + u * 0.6, w: field.w, h: lh }, field });
    items.push({ m: 'caption', r: { x: L.x + ip, y: bottom, w: L.w - ip * 2, h: ch } });
    if (Rp) {

    }
    if (f.holdOn) {
      let any = false; x.beginPath();
      for (let i = 0; i < n; i++) {
        const pv = ch.p[i] * s + 0.35;
        if (pv < 1) continue;
        any = true; add(i, Math.min(s - 1, Math.floor(pv) - 1));
      }
      if (any) { x.fillStyle = t.peak; x.fill(); }
    }
  }
}

/* ============================================================
   Start / error overlay
   ============================================================ */
function buildLamps() {
  const n = 24;
  let h = '';
  for (let i = 0; i < n; i++) {
    const lvl = Math.round(clamp(4.6 - 2.6 * (i / n) + 1.2 * Math.sin(i * 1.3), 1, 6));
    h += '<i>' + Array.from({ length: 6 }, (_, j) => `<b class="${j < lvl ? 'on' : ''}"></b>`).join('') + '</i>';
  }
  $('ovLamps').innerHTML = h;
}
function showOverlay(title, sub, buttons, err) {
  $('ovTitle').textContent = title;
  $('ovTitle').classList.toggle('err', !!err);
  $('ovSub').innerHTML = sub;
  $('ovBtns').innerHTML = buttons.map(b => `<button class="ovb" data-ov="${b[0]}">${b[1]}</button>`).join('');
  $('overlay').classList.remove('hidden');
  App.overlay = err ? 'error' : 'start';
}
function showStart() { showOverlay('TAP TO START', srcName() + (DEMO ? ' &middot; DEMO SIGNAL' : ''), [], false); }
function hideOverlay() { $('overlay').classList.add('hidden'); App.overlay = null; }
function showError(code) {
  App.running = false;
  const M = {
    NO_LINE: ['NO LINE INPUT', 'CHECK INTERFACE', [['mic', 'USE MICROPHONE'], ['retry', 'RETRY']]],
    NO_MIC: ['NO MICROPHONE', 'NO BUILT-IN INPUT FOUND', [['line', 'USE LINE IN'], ['retry', 'RETRY']]],
    DENIED: ['NO INPUT', 'GRANT MICROPHONE ACCESS IN SETTINGS', [['retry', 'RETRY']]],
    INSECURE: ['NO INPUT', 'THIS PAGE MUST BE SERVED OVER HTTPS', []]
  };
  const [t, s, b] = M[code] || M.DENIED;
  showOverlay(t, s, b, true);
}

async function start() {
  if (App.busy) return;
  App.busy = true;
  ensureCtx();                                   // inside the tap gesture (iOS)
  try {
    const trackOk = A.live && (DEMO || (A.track && A.track.readyState === 'live'));
    if (!trackOk) await openSource(S.source);
    if (A.ctx.state !== 'running') { try { await A.ctx.resume(); } catch (e) { } }
    if (A.ctx.state !== 'running') { showStart(); return; }
    App.running = true;
    P.fade = 0; P.fadeTarget = 1;
    hideOverlay();
    requestWake();
  } catch (e) {
    teardown();
    showError(e.code || 'DENIED');
  } finally { App.busy = false; }
}

// Switch source without reloading: bars sink, graph is rebuilt, bars rise.
async function switchSource(to, force) {
  if (to === S.source && !force) return;
  S.source = to; save();
  if (UI.open) buildSettings();
  if (!App.running) { if (App.overlay === 'start') showStart(); return; }
  App.busy = true;
  GATE.open = false; GATE.hist = [];
  P.fadeTarget = 0;
  await sleep(170);
  try { await openSource(to); P.fadeTarget = 1; requestWake(); }
  catch (e) { teardown(); showError(e.code || 'DENIED'); }
  finally { App.busy = false; if (UI.open) buildSettings(); }
}

// Fullscreen API (works for whole pages on iPad, not just video): hides the iOS status bar.
// Needs a tap every launch, so the start tap asks for it too.
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
const FS_OK = !IN_APP && !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
function enterFullscreen() {
  if (!FS_OK || fsEl()) return;
  const el = document.documentElement;
  try { const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (p && p.catch) p.catch(() => { }); } catch (e) { }
}
function toggleFullscreen() {
  if (!fsEl()) { enterFullscreen(); return; }
  try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) { }
}
for (const ev of ['fullscreenchange', 'webkitfullscreenchange']) document.addEventListener(ev, () => { setTimeout(onResize, 100); if (UI.open) buildSettings(); });

$('overlay').addEventListener('click', e => {
  if (S.fullscreen) enterFullscreen();             // must run synchronously inside the tap
  const b = e.target.closest('[data-ov]');
  if (b) {
    const a = b.dataset.ov;
    if (a === 'mic' || a === 'line') { S.source = a; save(); }
    start();
    return;
  }
  if (App.overlay === 'start') start();
});

/* ============================================================
   Settings panel
   ============================================================ */
const thumbCache = new Map();
function thumbFrame(t) {
  const n = 24, v = new Float32Array(n), p = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    v[i] = clamp(0.8 - 0.45 * (i / n) + 0.17 * Math.sin(i * 1.7) + 0.08 * Math.cos(i * 0.6), 0.06, 0.94);
    p[i] = Math.min(1, v[i] + 0.07 + 0.05 * ((i * 7) % 3));
  }
  return { now: 0, theme: t, chans: [{ v, p }], segs: t.segments ?? 16, glow: 0, opts: { labels: true, clockPanel: true, scanlines: true },
    flags: { st: true, dsp: true, loud: true, over: false, source: 'line' }, autoOn: true, music: true, clock: { hm: '12:33', mdSlash: '10/05', md: '10-5', dow: 'MON' },
    battery: 40, sr: 48000, sig: 0.6, level: 0.5, safe: null, holdOn: true };
}
function thumbFor(t) {
  let c = thumbCache.get(t.id);
  if (!c) {
    c = document.createElement('canvas');
    const r = new Renderer(c, false);
    r.resize(400, 250, 2);
    r.render(thumbFrame(t));
    thumbCache.set(t.id, c);
  }
  return c;
}

function optRow(label, key, opts, cur, sub = '', disabled = () => false) {
  return `<div class="row"><div class="lbl">${label}${sub ? `<small>${sub}</small>` : ''}</div><div class="opts">` +
    opts.map(([v, txt]) => `<button class="opt${String(v) === String(cur) ? ' on' : ''}" data-k="${key}" data-v="${v}"${disabled(v) ? ' disabled' : ''}>${txt}</button>`).join('') +
    '</div></div>';
}
function sliderRow(label, sub, key, min, max, val, unit) {
  return `<div class="row"><div class="lbl">${label}${sub ? `<small>${sub}</small>` : ''}</div><div class="slider">` +
    `<input type="range" min="${min}" max="${max}" step="1" value="${val}" data-s="${key}"><span class="val" id="v-${key}">${fmtVal(val, unit)}</span></div></div>`;
}
function autoStatus() {
  const w = P.window || autoWindow(), d = v => '−' + Math.abs(Math.round(v));
  return `${d(w[0])} TO ${d(w[1])} dBFS · ${!App.running ? 'IDLE' : P.music ? 'MUSIC' : 'SILENCE'}`;
}
setInterval(() => {
  if (!UI.open) return;
  const el = $('autoStat'), fp = $('fps');
  if (el) el.textContent = autoStatus();
  if (fp) fp.textContent = Math.round(1000 / P.ema);
}, 400);
const fmtVal = (v, unit) => unit === '%' ? v + '%' : (v < 0 ? '−' + Math.abs(v) : v) + ' dBFS';
const onOff = [[true, 'ON'], [false, 'OFF']];

function buildSettings() {
  const sh = $('sheet'), scroll = sh.scrollTop, ps = S.perSource[S.source], mic = S.source === 'mic', sn = srcName();
  const devCur = S.devices[S.source];
  const devOpts = [`<option value="">AUTO — ${mic ? 'BUILT-IN MICROPHONE' : 'EXTERNAL INTERFACE'}</option>`]
    .concat(A.devices.filter(d => d.deviceId !== 'communications' && d.deviceId !== 'default')
      .map((d, i) => `<option value="${esc(d.deviceId)}"${d.deviceId === devCur ? ' selected' : ''}>${esc((d.label || 'INPUT ' + (i + 1)).toUpperCase())}</option>`)).join('');
  const status = App.running && A.live
    ? `ACTIVE INPUT: <b>${esc((A.deviceLabel || '—').toUpperCase())}</b> &middot; ${P.sr / 1000} kHz &middot; ${A.stereo ? '2 CH' : '1 CH'} &middot; <span id="fps">${Math.round(1000 / P.ema)}</span> FPS`
    : 'NOT RUNNING';
  sh.innerHTML =
    `<div class="sh-head"><div class="sh-title">SETTINGS</div><button class="x" data-act="close" aria-label="Close">×</button></div>` +
    optRow('SOURCE', 'source', [['line', 'LINE IN'], ['mic', 'MICROPHONE']], S.source, 'LONG-PRESS LINE/MIC FLAG') +
    `<div class="row full"><div class="lbl">THEME</div><div class="themes">` +
    THEMES.map(t => `<button class="card" data-theme="${t.id}" style="background:${t.panel};border-color:${t.id === S.theme ? t.accent : 'transparent'}">` +
      `<span style="color:${t.accent}">${t.name.toUpperCase()}</span></button>`).join('') + `</div></div>` +
    optRow('BANDS', 'bands', BAND_OPTS.map(v => [v, v]), S.bands, P.bandCap < S.bands ? 'REDUCED FOR SPEED: ' + effBands() : '') +
    optRow('BARS', 'segments', [[16, 'BLOCKS'], [0, 'SMOOTH']], S.segments ? 16 : 0) +
    optRow('GLOW', 'glow', [['off', 'OFF'], ['subtle', 'SUBTLE'], ['full', 'FULL']], S.glow, 'BEHIND THE BLOCKS') +
    optRow('CHANNELS', 'channels', [['mono', 'MONO'], ['stereo', 'STEREO']], mic ? 'mono' : S.channels, mic ? 'MIC IS MONO' : '', v => mic && v === 'stereo') +
    optRow('PEAK HOLD', 'peakHold', HOLD_OPTS.map(v => [v, v ? v + ' MS' : 'OFF']), S.peakHold) +
    optRow('DECAY', 'decay', [['slow', 'SLOW'], ['medium', 'MEDIUM'], ['fast', 'FAST']], S.decay) +
    optRow('SENSITIVITY', 'auto', [[true, 'AUTO'], [false, 'MANUAL']], ps.auto, sn) +
    (ps.auto
      ? `<div class="row"><div class="lbl">AUTO LEVEL<small>LEARNS AS IT LISTENS</small></div><div class="opts" style="align-items:center;gap:14px">` +
        `<span class="val" id="autoStat" style="text-align:left;min-width:0;flex:1">${autoStatus()}</span>` +
        `<button class="opt" data-act="relearn">RELEARN</button></div></div>`
      : sliderRow('FLOOR', sn, 'floor', -100, -40, ps.floor) + sliderRow('CEILING', sn, 'ceil', -60, 0, ps.ceil)) +
    optRow('TILT', 'tilt', onOff, ps.tilt, sn + ' &middot; +3 DB/OCT') +
    optRow('LABELS', 'labels', onOff, S.labels) +
    optRow('CLOCK PANEL', 'clockPanel', onOff, S.clockPanel, 'OR TAP CLOCK IN HEADER') +
    optRow('BARS ONLY', 'barsOnly', onOff, S.barsOnly, 'OR DOUBLE-TAP THE DISPLAY') +
    optRow('SCANLINES', 'scanlines', onOff, S.scanlines) +
    (FS_OK ? optRow('FULL SCREEN', 'fullscreen', onOff, S.fullscreen, 'HIDES THE STATUS BAR &middot; ON EACH START') +
      `<div class="row"><div class="lbl"></div><div class="opts"><button class="opt${fsEl() ? ' on' : ''}" data-act="fs">${fsEl() ? 'EXIT FULL SCREEN' : 'GO FULL SCREEN NOW'}</button></div></div>` : '') +
    `<div class="row"><div class="lbl">INPUT DEVICE<small>${sn}</small></div><select id="devSel">${devOpts}</select></div>` +
    sliderRow('BRIGHTNESS', '', 'brightness', 20, 100, S.brightness, '%') +
    `<div class="note">${status}<br>` +
    (WAKE_OK || IN_APP ? '' : 'SCREEN WAKE LOCK IS NOT AVAILABLE HERE — SET AUTO-LOCK TO NEVER IN IPAD SETTINGS.<br>') +
    'TWO-FINGER TAP OPENS SETTINGS &middot; TAP OUTSIDE TO CLOSE</div>';
  sh.querySelectorAll('.card').forEach(card => card.insertBefore(thumbFor(THEMES.find(t => t.id === card.dataset.theme)), card.firstChild));
  sh.scrollTop = scroll;
}
function openSettings() {
  UI.open = true;
  buildSettings();
  $('settings').classList.remove('hidden');
  listInputs().then(d => { if (d.length && d.some(x => x.label)) { A.devices = d; if (UI.open) buildSettings(); } });
}
function closeSettings() { UI.open = false; $('settings').classList.add('hidden'); }

function applyTheme() {
  const t = theme(), st = document.documentElement.style;
  st.setProperty('--bg', t.bg); st.setProperty('--panel', t.panel); st.setProperty('--accent', t.accent);
  st.setProperty('--label', t.label); st.setProperty('--segoff', t.segOff);
  st.setProperty('--line', rgba(t.accent, 0.22)); st.setProperty('--glow', rgba(t.accent, t.inverted ? 0.15 : 0.55));
  $('themeColor').setAttribute('content', t.bg);
}
function applyBrightness() { document.documentElement.style.setProperty('--bri', S.brightness / 100); }

$('settings').addEventListener('click', e => {
  if (e.target === $('settings')) { closeSettings(); return; }       // tap outside the panel
  const b = e.target.closest('[data-k],[data-theme],[data-act]');
  if (!b || b.disabled) return;
  if (b.dataset.act === 'close') { closeSettings(); return; }
  if (b.dataset.act === 'relearn') { relearn(); buildSettings(); return; }
  if (b.dataset.act === 'fs') { toggleFullscreen(); return; }
  if (b.dataset.theme) {
    S.theme = b.dataset.theme;
    const t = theme();
    if (t.segments !== undefined) S.segments = t.segments ? 16 : 0;
    save(); applyTheme(); buildSettings();
    return;
  }
  const k = b.dataset.k, raw = b.dataset.v;
  const v = raw === 'true' ? true : raw === 'false' ? false : /^-?\d+$/.test(raw) ? +raw : raw;
  if (k === 'source') { switchSource(v); return; }
  if (k === 'tilt' || k === 'auto') S.perSource[S.source][k] = v;
  else S[k] = v;
  if (k === 'bands') P.bandCap = 99;
  save(); buildSettings();
});
$('settings').addEventListener('input', e => {
  const el = e.target, k = el.dataset.s;
  if (!k) return;
  const ps = S.perSource[S.source];
  let v = +el.value;
  if (k === 'floor') { v = Math.min(v, ps.ceil - 6); ps.floor = v; }
  else if (k === 'ceil') { v = Math.max(v, ps.floor + 6); ps.ceil = v; }
  else { S.brightness = v; applyBrightness(); }
  el.value = v;
  $('v-' + k).textContent = fmtVal(v, k === 'brightness' ? '%' : '');
  save();
});
$('settings').addEventListener('change', e => {
  if (e.target.id !== 'devSel') return;
  S.devices[S.source] = e.target.value; save();
  if (App.running) switchSource(S.source, true);
});

/* ============================================================
   Touch: menu button, long-press source flag, two-finger tap
   ============================================================ */
const cv = $('cv'), R = new Renderer(cv, true);
const inRect = (p, r) => r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
const ptrs = new Map();
let lpTimer = null;
const cancelLP = () => { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } };
cv.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, t: performance.now() });
  if (ptrs.size === 2) { cancelLP(); openSettings(); return; }
  if (inRect({ x: e.clientX, y: e.clientY }, R.hits.source))
    lpTimer = setTimeout(() => { lpTimer = null; switchSource(S.source === 'line' ? 'mic' : 'line'); }, 600);
});
cv.addEventListener('pointerup', e => {
  const d = ptrs.get(e.pointerId);
  ptrs.delete(e.pointerId);
  cancelLP();
  if (!d || ptrs.size !== 0 || performance.now() - d.t >= 500) return;
  const p = { x: e.clientX, y: e.clientY };
  if (inRect(p, R.hits.menu)) openSettings();
  else if (inRect(p, R.hits.clock)) { S.clockPanel = !S.clockPanel; save(); }
  else if (inRect(p, R.hits.source)) { /* long-press only */ }
  else if (lastTap && performance.now() - lastTap.t < 350 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 40) {
    S.barsOnly = !S.barsOnly; save(); lastTap = null;      // double-tap: bars only <-> full display
    return;
  }
  lastTap = { x: p.x, y: p.y, t: performance.now() };
});
let lastTap = null;
cv.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); cancelLP(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSettings();
  else if (e.key === 's' && !UI.open) openSettings();
  else if (e.key === 'm' && DEMO && A.demoMute) A.demoMute.gain.value = A.demoMute.gain.value ? 0 : 1;
});
document.addEventListener('gesturestart', e => e.preventDefault());   // iOS pinch-zoom

/* ============================================================
   Lifecycle, resize, main loop
   ============================================================ */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (App.running) {
    const lost = !A.ctx || A.ctx.state !== 'running' || (!DEMO && (!A.track || A.track.readyState === 'ended'));
    if (lost) { App.running = false; showStart(); }   // never show a frozen analyser
    else requestWake();
  }
});

let SAFE = { t: 0, r: 0, b: 0, l: 0 };
function onResize() {
  const cs = getComputedStyle($('safe'));
  SAFE = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
  R.resize(window.innerWidth, window.innerHeight, Math.min(window.devicePixelRatio || 1, 3));
}
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 250));

const DOW = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
let _clk = { s: -1 };
function clock() {
  const d = new Date(), s = Math.floor(d.getTime() / 1000);
  if (s !== _clk.s) {
    const p = n => String(n).padStart(2, '0');
    _clk = { s, hm: p(d.getHours()) + ':' + p(d.getMinutes()), mdSlash: p(d.getMonth() + 1) + '/' + p(d.getDate()),
      md: (d.getMonth() + 1) + '-' + d.getDate(), dow: DOW[d.getDay()] };
  }
  return _clk;
}

// If frames get slow, step the band count down rather than drop frames.
function perf(ms, now) {
  if (ms > 100) return;
  P.ema = P.ema * 0.95 + ms * 0.05;
  if (App.running && P.ema > 24) {
    if (!P.slowSince) P.slowSince = now;
    else if (now - P.slowSince > 3000 && BAND_OPTS.indexOf(effBands()) > 0) { P.bandCap = BAND_OPTS[BAND_OPTS.indexOf(effBands()) - 1]; P.slowSince = 0; P.ema = 16; }
  } else P.slowSince = 0;
}

let lastT = performance.now(), lastLearnSave = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const ms = now - lastT, dt = Math.min(0.1, ms / 1000);
  lastT = now;
  perf(ms, now);
  if (App.running && now - lastLearnSave > 20000) { lastLearnSave = now; save(); }   // keep what auto-level learned
  if (P.n !== effBands()) setupBands();
  process(now, dt);
  const t = theme(), ps = S.perSource[S.source];
  R.render({
    now, dt, theme: t, autoOn: ps.auto, music: P.music,
    chans: stereoDisplay() ? [P.chans.L, P.chans.R] : [P.chans.M],
    segs: S.segments, glow: { off: 0, subtle: 0.25, full: 0.55 }[S.glow], opts: { labels: S.labels, clockPanel: S.clockPanel, scanlines: S.scanlines, barsOnly: S.barsOnly },
    flags: { st: A.live && A.stereo, dsp: ps.tilt || S.source === 'mic', loud: now < P.loudUntil, over: now < P.overUntil, source: S.source },
    clock: clock(), battery: BAT.pct, sr: P.sr, sig: P.sig, level: P.level, safe: SAFE, holdOn: S.peakHold > 0
  });
}

function makeIcon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const x = c.getContext('2d');
    x.fillStyle = '#000'; x.fillRect(0, 0, 180, 180);
    [5, 8, 6, 9, 7, 4, 3].forEach((h, i) => {
      for (let j = 0; j < 10; j++) { x.fillStyle = j < h ? '#A8F0C8' : '#1B2E24'; x.beginPath(); rr(x, 24 + i * 19, 152 - j * 13 - 10, 10, 10, 5); x.fill(); }
    });
    $('touchIcon').href = c.toDataURL('image/png');
  } catch (e) { }
}

onResize();
applyTheme();
applyBrightness();
setupBands();
buildLamps();
showStart();
makeIcon();
requestAnimationFrame(frame);
</script>
</body>
